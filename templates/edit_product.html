<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Product - ASTRID Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-header bg-warning">
                <h4 class="mb-0">Edit Product #{{ product.id }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Product Name</label>
                        <input type="text" name="name" value="{{ product.name }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Brand</label>
                        <input type="text" name="brand" value="{{ product.brand }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select">
                            <option value="MEN" {% if product.category == 'MEN' %}selected{% endif %}>MEN</option>
                            <option value="WOMEN" {% if product.category == 'WOMEN' %}selected{% endif %}>WOMEN</option>
                            <option value="KIDS" {% if product.category == 'KIDS' %}selected{% endif %}>KIDS</option>
                            <option value="BEAUTY" {% if product.category == 'BEAUTY' %}selected{% endif %}>BEAUTY</option>
                            <option value="LUXURY" {% if product.category == 'LUXURY' %}selected{% endif %}>LUXURY</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Price (PHP)</label>
                        <input type="number" step="0.01" name="price" value="{{ product.price }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Image URL</label>
                        <input type="url" name="image" value="{{ product.image }}" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3">{{ product.description }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
