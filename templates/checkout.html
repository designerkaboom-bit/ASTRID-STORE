<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ASTRID</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="navbar">
        <div class="logo"><a href="{{ url_for('home') }}" style="text-decoration:none; color:inherit;">ASTRID</a></div>
    </header>

    <main class="container" style="margin-top: 30px; max-width: 600px;">
        {% if success %}
        <div style="text-align: center; padding: 50px 0;">
            <h2 style="color: green;">🎉 Order Placed Successfully!</h2>
            <p>Thank you for shopping at ASTRID. Your order is being processed.</p>
            <br>
            <a href="{{ url_for('home') }}" class="add-cart-btn" style="display: inline-block; padding: 10px 20px;">BACK TO HOME</a>
        </div>
        {% else %}
        <h2>CHECKOUT</h2>
        <form method="POST" style="margin-top: 20px; display: flex; flex-direction: column; gap: 15px;">
            <input type="text" placeholder="Full Name" required style="padding: 10px; font-size: 14px;">
            <input type="email" placeholder="Email Address" required style="padding: 10px; font-size: 14px;">
            <textarea placeholder="Delivery Address" required style="padding: 10px; font-size: 14px; height: 80px;"></textarea>
            
            <h4>Order Total: ₱{{ "{:,}".format(total_price) }}</h4>
            <button type="submit" class="add-cart-btn" style="padding: 12px; border: none; cursor: pointer;">PLACE ORDER</button>
        </form>
        {% endif %}
    </main>

</body>
</html>
